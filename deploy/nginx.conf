server {
    listen 443 ssl http2;
    server_name owner-domain.example;
    root /srv/studio/current/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/owner-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/owner-domain.example/privkey.pem;
    client_max_body_size 12m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ^~ /build/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
server { listen 80; server_name owner-domain.example; return 301 https://$host$request_uri; }
